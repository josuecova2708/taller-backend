services:
  postgres:
    image: postgres:16-alpine
    container_name: taller-postgres
    environment:
      POSTGRES_USER: taller_user
      POSTGRES_PASSWORD: taller_pass_2026
      POSTGRES_DB: taller_obd
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: taller-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=taller2026
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=taller_user
      - DB_POSTGRESDB_PASSWORD=taller_pass_2026
      - WEBHOOK_URL=http://localhost:5678/
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
